name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (includes pulp[cbc] for the optional MILP packer)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check the CBC solver is available (MILP tests would otherwise skip silently)
        run: python -c "from app.core.milp_packer import pulp_available; assert pulp_available(), 'CBC not available'"
      - name: Run tests
        run: python -m pytest -q
